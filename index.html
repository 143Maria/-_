<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshGo - Головна</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-top">
        <div class="logo-section">
            <div class="logo-icon"></div>
            <div class="logo-text">FreshGo</div>
        </div>
        <nav class="nav-menu">
            <a href="index.html">Категорії</a>
            <a href="milk.html">Продукція</a>
            <a href="cart.html">Кошик</a>
        </nav>
    </header>

    <main class="container">
        <div class="main-layout">
            <div class="search-section">
                <div class="shopping-cart-img"></div>
                <div class="search-box">
                   <img src="https://cdn-icons-png.flaticon.com/256/9446/9446155.png" width="480px" height="480px"
                    <input type="text" placeholder="Введіть для пошуку..." class="search-input">
                    <button class="search-button">Знайти</button>
                </div>
            </div>
            <div class="categories-section">
                <a href="milk.html" class="category-card">
                    <div class="category-icon icon-milk"></div>
                  <img src="https://foodservice.ck.ua/wp-content/uploads/2022/05/5-512x512.png" width="240px" height="160px"
                    <span class="category-name">Молочна продукція</span>
                </a>
                <a href="bakery.html" class="category-card">
                    <div class="category-icon icon-bakery"></div>
                   <img src="https://images.silpo.ua/v2/products/744x744/webp/006594ab-ff89-4db7-9ace-fbef1df6a2d0.png" width="240px" height="160px"
                    <span class="category-name">Хлібобулочні вироби</span>
                </a>
                <a href="meat.html" class="category-card">
                    <div class="category-icon icon-meat"></div>
                   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyXIbuQoH6qgA2trfFqHwjoTMMmExUWAkVYQ&s" width="240px" height="160px"
                    <span class="category-name">М'ясо та ковбаси</span>
                </a>
                <a href="sweets.html" class="category-card">
                    <div class="category-icon icon-sweets"></div>
                   <img src="https://www.tea4you.com.ua/image/catalog/%D0%92%D1%81%D0%B5%20%D0%BF%D0%B5%D1%80%D0%B5%D0%B4%D0%B5%D0%BB%D1%8B%D0%B2%D0%B0%D1%8E/%D0%A1%D0%BB%D0%B0%D0%B4%D0%BE%D1%81%D1%82%D0%B8.jpeg" width="240px" height="160px"
                    <span class="category-name">Солодощі</span>
                </a>
                <button class="order-button-main" onclick="window.location.href='cart.html'">Зробити замовлення</button>
            </div>
        </div>
    </main>

    <footer class="footer-bottom">
        <span class="footer-slogan">Freshness every day – straight to your door</span>
        <div class="social-links">
            <a href="#" class="social-link" title="Facebook"></a>
            <a href="#" class="social-link" title="Messenger"></a>
            <a href="#" class="social-link" title="Instagram"></a>
        </div>
        <span class="contact-info">+(380) 99554378</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
